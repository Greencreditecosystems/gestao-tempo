<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GCP — Gestão por Ciclos de Prioridade</title>
    <style>
        :root {
            --pessoal: #4ECDC4;
            --familia: #FF6B6B;
            --profissional: #45B7D1;
            --bg: #0F0F0F;
            --card: #1A1A1A;
            --card2: #222;
            --text: #E0E0E0;
            --muted: #888;
            --border: #2A2A2A;
            --gold: #FFD93D;
            --danger: #FF4757;
            --success: #2ED573;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 500px;
            margin: 0 auto;
            padding: 12px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-size: 14px;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 8px 0 6px 0;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--pessoal), var(--profissional), var(--familia));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .header .date {
            font-size: 11px;
            color: var(--muted);
        }

        /* PILLS */
        .pill-row {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .pill {
            flex: 1;
            background: var(--card);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pill.pessoal {
            border-color: var(--pessoal);
        }

        .pill.familia {
            border-color: var(--familia);
        }

        .pill.profissional {
            border-color: var(--profissional);
        }

        .pill .pill-emoji {
            font-size: 20px;
        }

        .pill .pill-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            margin-top: 1px;
        }

        .pill .pill-count {
            font-size: 22px;
            font-weight: 900;
        }

        .pill.pessoal .pill-count {
            color: var(--pessoal);
        }

        .pill.familia .pill-count {
            color: var(--familia);
        }

        .pill.profissional .pill-count {
            color: var(--profissional);
        }

        /* TABS PRINCIPAIS */
        .main-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            background: var(--card);
            border-radius: 12px;
            padding: 4px;
        }

        .main-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--muted);
            letter-spacing: -0.3px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .main-tab.active {
            background: var(--border);
            color: #fff;
        }

        /* SELETOR DE DIA */
        .day-selector {
            display: flex;
            gap: 3px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .day-selector::-webkit-scrollbar {
            height: 0;
        }

        .day-chip {
            min-width: 42px;
            padding: 8px 6px;
            text-align: center;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            background: var(--card);
            color: var(--muted);
            border: 1px solid var(--border);
            transition: all 0.15s;
            white-space: nowrap;
            font-family: inherit;
        }

        .day-chip.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .day-chip.hoje {
            border-color: var(--gold);
            color: var(--gold);
        }

        .day-chip.hoje.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        /* MÉTRICAS MINI */
        .metricas-mini {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .metrica-card {
            flex: 1;
            background: var(--card);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .metrica-valor {
            font-size: 22px;
            font-weight: 900;
        }

        .metrica-valor.green {
            color: var(--pessoal);
        }

        .metrica-valor.red {
            color: var(--familia);
        }

        .metrica-valor.gold {
            color: var(--gold);
        }

        .metrica-label {
            font-size: 9px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 1px;
        }

        /* SEÇÃO DE BLOCOS */
        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: space-between;
        }

        .section-title-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title-left::after {
            content: '';
            width: 40px;
            height: 1px;
            background: var(--border);
        }

        .block-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .block {
            background: var(--card);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .block:active {
            transform: scale(0.985);
        }

        .block.pessoal {
            border-left-color: var(--pessoal);
        }

        .block.familia {
            border-left-color: var(--familia);
        }

        .block.profissional {
            border-left-color: var(--profissional);
        }

        .block.fixo {
            background: var(--card2);
            border-left-width: 4px;
        }

        .block.done {
            opacity: 0.4;
        }

        .block.done .block-title {
            text-decoration: line-through;
            text-decoration-color: var(--muted);
        }

        .block .block-time {
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            min-width: 62px;
            letter-spacing: -0.3px;
            text-align: center;
            line-height: 1.3;
        }

        .block .block-info {
            flex: 1;
            min-width: 0;
        }

        .block .block-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
        }

        .block .block-pilar-tag {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: inline-block;
            padding: 1px 5px;
            border-radius: 3px;
            margin-top: 2px;
        }

        .block.pessoal .block-pilar-tag {
            background: rgba(78, 205, 196, 0.2);
            color: var(--pessoal);
        }

        .block.familia .block-pilar-tag {
            background: rgba(255, 107, 107, 0.2);
            color: var(--familia);
        }

        .block.profissional .block-pilar-tag {
            background: rgba(69, 183, 209, 0.2);
            color: var(--profissional);
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 12px;
            transition: all 0.2s;
            font-weight: 900;
        }

        .block.done .checkbox {
            background: var(--gold);
            border-color: var(--gold);
            color: #000;
        }

        /* BOTÕES */
        .btn {
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-gold {
            background: var(--gold);
            color: #000;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 10px;
            border-radius: 7px;
        }

        .btn-xs {
            padding: 3px 8px;
            font-size: 9px;
            border-radius: 5px;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        /* BALDE */
        .balde-section {
            background: var(--card);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
            border: 2px dashed var(--border);
        }

        .balde-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .balde-title {
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .balde-count {
            background: var(--gold);
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 1px 7px;
            border-radius: 8px;
        }

        .balde-input-row {
            display: flex;
            gap: 6px;
        }

        .balde-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        .balde-input:focus {
            border-color: var(--gold);
        }

        .balde-input::placeholder {
            color: #555;
        }

        .balde-items {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .balde-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 9px;
            background: var(--bg);
            border-radius: 7px;
            font-size: 11px;
            justify-content: space-between;
        }

        .balde-item-text {
            flex: 1;
            min-width: 0;
            word-break: break-word;
        }

        .balde-item-del {
            color: var(--danger);
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            padding: 0 3px;
        }

        /* CHECK-IN */
        .checkin-section {
            background: var(--card);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .checkin-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .checkin-row label {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            min-width: 100px;
            padding-top: 8px;
        }

        .checkin-row input,
        .checkin-row textarea {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px;
            color: var(--text);
            font-size: 12px;
            outline: none;
            font-family: inherit;
            resize: vertical;
            min-width: 150px;
        }

        .checkin-row input:focus,
        .checkin-row textarea:focus {
            border-color: var(--gold);
        }

        .nps-buttons {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
        }

        .nps-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: transparent;
            color: var(--text);
            font-weight: 700;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .nps-btn.selected {
            border-color: var(--gold);
            background: var(--gold);
            color: #000;
        }

        /* VISÃO SEMANAL */
        .semana-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .semana-dia {
            background: var(--card);
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }

        .semana-dia:active {
            transform: scale(0.985);
        }

        .semana-dia.hoje {
            border-left-color: var(--gold);
        }

        .semana-dia-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .semana-dia-nome {
            font-weight: 700;
            font-size: 13px;
        }

        .semana-dia-data {
            font-size: 10px;
            color: var(--muted);
        }

        .semana-dia-stats {
            display: flex;
            gap: 8px;
            font-size: 10px;
            color: var(--muted);
        }

        .semana-dia-stats span {
            font-weight: 700;
        }

        .semana-barra {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .semana-barra-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }

        .semana-barra-fill.green {
            background: var(--success);
        }

        .semana-barra-fill.yellow {
            background: var(--gold);
        }

        .semana-barra-fill.red {
            background: var(--danger);
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--card);
            border-radius: 14px;
            padding: 18px;
            width: 92%;
            max-width: 460px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal h3 {
            font-size: 15px;
            margin-bottom: 12px;
        }

        .modal input,
        .modal textarea,
        .modal select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 10px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            font-family: inherit;
            margin-bottom: 8px;
            resize: vertical;
        }

        .modal select {
            appearance: none;
            -webkit-appearance: none;
        }

        .modal-buttons {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            margin-top: 4px;
        }

        .modal-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .modal-row {
            display: flex;
            gap: 8px;
        }

        .modal-row>div {
            flex: 1;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 12px 0;
            font-size: 9px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        /* Util */
        .hidden {
            display: none !important;
        }

        .tag-fixo {
            font-size: 8px;
            background: rgba(255, 255, 255, 0.08);
            padding: 1px 5px;
            border-radius: 3px;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1>⚡ GCP</h1>
        <div class="date" id="currentDate"></div>
    </div>

    <!-- PILLS -->
    <div class="pill-row">
        <div class="pill pessoal">
            <div class="pill-emoji">🧑</div>
            <div class="pill-label">Pessoal</div>
            <div class="pill-count" id="count-pessoal">0</div>
        </div>
        <div class="pill familia">
            <div class="pill-emoji">👨‍👩‍👧‍👦</div>
            <div class="pill-label">Família</div>
            <div class="pill-count" id="count-familia">0</div>
        </div>
        <div class="pill profisional">
            <div class="pill-emoji">💼</div>
            <div class="pill-label">Profissional</div>
            <div class="pill-count" id="count-profissional">0</div>
        </div>
    </div>

    <!-- TABS PRINCIPAIS -->
    <div class="main-tabs">
        <button class="main-tab active" data-view="diario" onclick="switchView('diario')">📅 Diário</button>
        <button class="main-tab" data-view="semanal" onclick="switchView('semanal')">🗓️ Semanal</button>
    </div>

    <!-- VISÃO DIÁRIA -->
    <div id="viewDiario">
        <!-- SELETOR DE DIA -->
        <div class="day-selector" id="daySelector"></div>

        <!-- MÉTRICAS -->
        <div class="metricas-mini">
            <div class="metrica-card">
                <div class="metrica-valor green" id="metrica-blocks">0%</div>
                <div class="metrica-label">Concluído</div>
            </div>
            <div class="metrica-card">
                <div class="metrica-valor red" id="metrica-pendentes">0</div>
                <div class="metrica-label">Pendentes</div>
            </div>
            <div class="metrica-card">
                <div class="metrica-valor gold" id="metrica-total">0</div>
                <div class="metrica-label">Total Blocos</div>
            </div>
        </div>

        <!-- BLOCOS FIXOS -->
        <div class="section-title">
            <div class="section-title-left">🔒 ROTINA FIXA</div>
            <button class="btn btn-xs btn-outline" onclick="abrirModalRotina()">Editar</button>
        </div>
        <div class="block-list" id="blockListFixos"></div>

        <!-- BLOCOS EXTRAS -->
        <div class="section-title">
            <div class="section-title-left">📝 BLOCOS DO DIA</div>
            <button class="btn btn-xs btn-gold" onclick="abrirModalBloco()">+ Bloco</button>
        </div>
        <div class="block-list" id="blockListExtras"></div>

        <!-- BALDE -->
        <div class="balde-section">
            <div class="balde-header">
                <div class="balde-title">🪣 Balde <span class="balde-count" id="baldeCount">0</span></div>
                <button class="btn btn-xs btn-outline" onclick="limparBalde()">Limpar</button>
            </div>
            <div class="balde-input-row">
                <input type="text" class="balde-input" id="baldeInput" placeholder="Jogar demanda aqui..." onkeydown="if(event.key==='Enter')addBalde()">
                <button class="btn btn-sm btn-gold" onclick="addBalde()">+</button>
            </div>
            <div class="balde-items" id="baldeItems"></div>
        </div>

        <!-- CHECK-IN -->
        <div class="checkin-section">
            <div class="section-title">
                <div class="section-title-left">🌙 CHECK-IN</div>
            </div>
            <div class="checkin-row">
                <label>Importou hoje:</label>
                <textarea id="checkinImportou" rows="2" placeholder="O que fiz que realmente importa..."></textarea>
            </div>
            <div class="checkin-row">
                <label>Ficou p/ amanhã:</label>
                <textarea id="checkinFicou" rows="2" placeholder="O que não fiz e preciso fazer..."></textarea>
            </div>
            <div class="checkin-row">
                <label>Nota (0-10):</label>
                <div class="nps-buttons" id="npsButtons"></div>
                <input type="hidden" id="npsValue" value="">
            </div>
            <button class="btn btn-gold" style="width:100%;margin-top:4px;" onclick="salvarCheckin()">💾 Salvar Check-in</button>
        </div>
    </div>

    <!-- VISÃO SEMANAL -->
    <div id="viewSemanal" class="hidden">
        <div class="section-title">
            <div class="section-title-left">📊 VISÃO GERAL DA SEMANA</div>
            <span style="font-size:10px;color:var(--muted);" id="semanaRange"></span>
        </div>
        <div class="semana-grid" id="semanaGrid"></div>
    </div>

    <!-- MODAL: NOVO BLOCO EXTRA -->
    <div class="modal-overlay" id="modalBloco">
        <div class="modal">
            <h3>➕ Novo Bloco</h3>
            <div class="modal-label">Título</div>
            <input type="text" id="blocoTitulo" placeholder="Ex: Reunião Green Credit">
            <div class="modal-row">
                <div>
                    <div class="modal-label">Início</div>
                    <input type="time" id="blocoInicio" value="08:00">
                </div>
                <div>
                    <div class="modal-label">Fim</div>
                    <input type="time" id="blocoFim" value="09:00">
                </div>
            </div>
            <div class="modal-label">Pilar</div>
            <select id="blocoPilar">
                <option value="pessoal">🧑 Pessoal</option>
                <option value="familia">👨‍👩‍👧‍👦 Família</option>
                <option value="profissional">💼 Profissional</option>
            </select>
            <div class="modal-buttons">
                <button class="btn btn-outline" onclick="fecharModalBloco()">Cancelar</button>
                <button class="btn btn-gold" onclick="addBloco()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: EDITAR ROTINA DO DIA -->
    <div class="modal-overlay" id="modalRotina">
        <div class="modal">
            <h3>🔒 Editar Rotina — <span id="modalRotinaDia"></span></h3>
            <div id="modalRotinaList" style="max-height:300px;overflow-y:auto;margin-bottom:10px;"></div>
            <div style="border-top:1px solid var(--border);padding-top:8px;margin-bottom:8px;">
                <div class="modal-label">Adicionar à rotina</div>
                <input type="text" id="rotinaTitulo" placeholder="Título do bloco">

        const STORAGE_KEY = 'gcp_v2_data';

        function defaultData() {
            return {
                rotina: JSON.parse(JSON.stringify(ROTINA_PADRAO)),
                extras: {}, // { '2026-07-02': [{...}] }
                concluidos: {}, // { '2026-07-02': { 'fixo-0': true, 'extra-0': true } }
                balde: [],

        let diaSelecionado = getDateKey(new Date()); // '2026-07-02'
        let diaSemanaSelecionado = getDiaSemana(new Date()); // 'qui'

        function loadData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try {
                    const d = JSON.parse(raw);
                    // Garantir que todos os dias da semana existam na rotina
                    for (const dia of DIAS_SEMANA) {
                        if (!d.rotina[dia]) d.rotina[dia] = JSON.parse(JSON.stringify(ROTINA_PADRAO[dia]));
                    }
                    if (!d.extras) d.extras = {};
                    if (!d.concluidos) d.concluidos = {};
                    if (!d.balde) d.balde = [];
                    if (!d.checkins) d.checkins = [];
                    return d;
                } catch (e) { return defaultData(); }
            }
            return defaultData();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function getDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getDiaSemana(date) {
            return DIAS_SEMANA[date.getDay()];
        }

        function dateKeyToDate(key) {
            const [y, m, d] = key.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function getDateKeyFromDiaSemana(diaSemana) {
            const hoje = new Date();
            const hojeDS = DIAS_SEMANA[hoje.getDay()];
            const targetIdx = DIAS_SEMANA.indexOf(diaSemana);
            const hojeIdx = DIAS_SEMANA.indexOf(hojeDS);
            const diff = targetIdx - hojeIdx;
            const target = new Date(hoje);
            target.setDate(hoje.getDate() + diff);
            return getDateKey(target);
        }

        // ========== INIT ==========
        function init() {
            document.getElementById('currentDate').textContent =
                new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

            // NPS
            const npsDiv = document.getElementById('npsButtons');
            for (let i = 0; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.className = 'nps-btn';
                btn.textContent = i;
                btn.onclick = () => selecionarNPS(i);
                npsDiv.appendChild(btn);
            }

            // Day selector
            construirDaySelector();
            selecionarDia(getDateKey(new Date()));
            renderizarTudo();
        }

        function construirDaySelector() {
            const container = document.getElementById('daySelector');
            const hoje = new Date();
            let html = '';

            // Últimos 3 dias + hoje + próximos 7 dias
            for (let i = -3; i <= 7; i++) {
                const d = new Date(hoje);
                d.setDate(hoje.getDate() + i);
                const key = getDateKey(d);
                const ds = getDiaSemana(d);
                const isHoje = i === 0;
                const isSelected = key === diaSelecionado;

                let classes = 'day-chip';
                if (isHoje) classes += ' hoje';
                if (isSelected) classes += ' active';

                const label = isHoje ? 'Hoje' : `${NOMES_DIAS[ds]} ${d.getDate()}/${d.getMonth()+1}`;

                html +=
                    `<button class="${classes}" data-key="${key}" data-ds="${ds}" onclick="selecionarDia('${key}','${ds}')">${label}</button>`;
            }

            container.innerHTML = html;

            // Scroll até o dia selecionado
            setTimeout(() => {
                const active = container.querySelector('.day-chip.active');
                if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }, 100);
        }

        function selecionarDia(dateKey, diaSemana) {
            diaSelecionado = dateKey;
            diaSemanaSelecionado = diaSemana || getDiaSemana(dateKeyToDate(dateKey));
            construirDaySelector();
            document.getElementById('daySelector').querySelector(`[data-key="${dateKey}"]`)?.classList.add('active');
            renderizarTudo();
        }

        function switchView(view) {
            viewAtual = view;
            document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.main-tab[data-view="${view}"]`).classList.add('active');
            document.getElementById('viewDiario').classList.toggle('hidden', view !== 'diario');
            document.getElementById('viewSemanal').classList.toggle('hidden', view !== 'semanal');
            if (view === 'semanal') renderizarSemana();
            if (view === 'diario') renderizarTudo();
        }

        // ========== RENDER DIÁRIO ==========
        function renderizarTudo() {
            if (viewAtual !== 'diario') return;
            renderizarBlocos();
            renderizarBalde();
            carregarCheckin();
            atualizarPills();
            atualizarMetricas();
            saveData();

        function getBlocosDoDia() {
            const rotina = data.rotina[diaSemanaSelecionado] || [];
            const extras = data.extras[diaSelecionado] || [];
            const concluidos = data.concluidos[diaSelecionado] || {};

            const fixos = rotina.map((b, i) => ({
                ...b,
                id: `fixo-${i}`,
                fixo: true,
                done: !!concluidos[`fixo-${i}`]
            }));

            const extrasComStatus = extras.map((b, i) => ({
                ...b,
                id: `extra-${i}`,
                fixo: false,
                done: !!concluidos[`extra-${i}`]
            }));

            return { fixos, extras: extrasComStatus, todos: [...fixos, ...extrasComStatus] };
        }

        function renderizarBlocos() {
            const { fixos, extras } = getBlocosDoDia();

            // Fixos
            const fixosContainer = document.getElementById('blockListFixos');
            if (fixos.length === 0) {
                fixosContainer.innerHTML =
                    '<div style="text-align:center;color:var(--muted);padding:12px;font-size:12px;">Nenhum bloco fixo. Toque em Editar.</div>';
            } else {
                fixosContainer.innerHTML = fixos.map(b => renderBlocoHTML(b, 'fixo')).join('');
            }

            // Extras
            const extrasContainer = document.getElementById('blockListExtras');
            if (extras.length === 0) {
                extrasContainer.innerHTML =
                    '<div style="text-align:center;color:var(--muted);padding:12px;font-size:12px;">Nenhum bloco extra. Toque em + Bloco.</div>';
            } else {
                extrasContainer.innerHTML = extras.map(b => renderBlocoHTML(b, 'extra')).join('');
            }
        }

        function renderBlocoHTML(b, tipo) {
            const pilarLabel = { pessoal: '🧑 Pessoal', familia: '👨‍👩‍👧‍👦 Família', profissional: '💼 Profissional' } [b
                .pilar
            ];
            return `
                <div class="block ${b.pilar} ${b.fixo ? 'fixo' : ''} ${b.done ? 'done' : ''}" onclick="toggleBloco('${tipo}', '${b.id}')">
                    <div class="checkbox">${b.done ? '✓' : ''}</div>
                    <div class="block-time">${b.inicio}<br>${b.fim}</div>
                    <div class="block-info">
                        <div class="block-title">${escapeHTML(b.titulo)}${b.fixo ? '<span class="tag-fixo">FIXO</span>' : ''}</div>
                        <span class="block-pilar-tag">${pilarLabel}</span>
                    </div>
                    ${!b.fixo ? `<span style="cursor:pointer;color:var(--danger);font-weight:700;padding:4px;" onclick="event.stopPropagation();removerBlocoExtra('${b.id}')">✕</span>` : ''}
                </div>
            `;
        }

        function toggleBloco(tipo, id) {
            if (!data.concluidos[diaSelecionado]) data.concluidos[diaSelecionado] = {};
            data.concluidos[diaSelecionado][id] = !data.concluidos[diaSelecionado][id];
            renderizarTudo();
        }

        function removerBlocoExtra(id) {
            const idx = parseInt(id.split('-')[1]);
            if (confirm('Remover este bloco?')) {
                if (!data.extras[diaSelecionado]) return;
                data.extras[diaSelecionado].splice(idx, 1);
                // Ajustar concluidos
                if (data.concluidos[diaSelecionado]) {
                    const novosConcluidos = {};
                    const extras = data.extras[diaSelecionado] || [];
                    Object.keys(data.concluidos[diaSelecionado]).forEach(k => {
                        if (k.startsWith('extra-')) {
                            const oldIdx = parseInt(k.split('-')[1]);
                            if (oldIdx < idx) novosConcluidos[k] = data.concluidos[diaSelecionado][k];
                            else if (oldIdx > idx) novosConcluidos[`extra-${oldIdx-1}`] = data.concluidos[
                                diaSelecionado][k];
                        } else {
                            novosConcluidos[k] = data.concluidos[diaSelecionado][k];
                        }
                    });
                    data.concluidos[diaSelecionado] = novosConcluidos;
                }
                renderizarTudo();
            }
        }

            const titulo = document.getElementById('blocoTitulo').value.trim();
            const inicio = document.getElementById('blocoInicio').value;
            const fim = document.getElementById('blocoFim').value;

            if (!data.extras[diaSelecionado]) data.extras[diaSelecionado] = [];
            data.extras[diaSelecionado].push({ titulo, inicio, fim, pilar, criadoEm: new Date().toISOString() });

            fecharModalBloco();
            renderizarTudo();
        }

                </div>
            `).join('');
        }

        function addRotinaItem() {
            const titulo = document.getElementById('rotinaTitulo').value.trim();
            const inicio = document.getElementById('rotinaInicio').value;
            const fim = document.getElementById('rotinaFim').value;
            const pilar = document.getElementById('rotinaPilar').value;

            if (!titulo) { alert('Digite um título.'); return; }

            data.rotina[diaSemanaSelecionado].push({ titulo, inicio, fim, pilar });
            // Ordenar por horário
            data.rotina[diaSemanaSelecionado].sort((a, b) => a.inicio.localeCompare(b.inicio));

            document.getElementById('rotinaTitulo').value = '';
            renderizarModalRotina();
            saveData();
        }

            data.rotina[diaSemanaSelecionado].splice(idx, 1);
            renderizarModalRotina();
            saveData();

                renderizarModalRotina();
                saveData();
            }

            data.balde.push(valor);

            saveData();

            const container = document.getElementById('baldeItems');

                container.innerHTML =
                    '<div style="text-align:center;color:var(--muted);padding:8px;font-size:11px;">Balde vazio. Jogue demandas aqui!</div>';

            container.innerHTML = data.balde.map((item, i) => `
                <div class="balde-item">
                    <span class="balde-item-text">${escapeHTML(item)}</span>
                    <span class="balde-item-del" onclick="removerBalde(${i})">✕</span>

        function carregarCheckin() {
            const checkin = (data.checkins || []).find(c => c.data === diaSelecionado);
            document.getElementById('checkinImportou').value = checkin?.importou || '';
            document.getElementById('checkinFicou').value = checkin?.ficou || '';

            const npsValue = checkin?.nps ?? null;
            document.getElementById('npsValue').value = npsValue !== null ? npsValue : '';
            document.querySelectorAll('.nps-btn').forEach((btn, i) => {
                btn.classList.toggle('selected', i === npsValue);
            });
        }

        function selecionarNPS(valor) {
            document.getElementById('npsValue').value = valor;
            document.querySelectorAll('.nps-btn').forEach((btn, i) => {
                btn.classList.toggle('selected', i === valor);
            });
        }

        function salvarCheckin() {
            const importou = document.getElementById('checkinImportou').value.trim();
            const ficou = document.getElementById('checkinFicou').value.trim();
            const npsVal = document.getElementById('npsValue').value;
            const nps = npsVal !== '' ? parseInt(npsVal) : null;

            data.checkins = (data.checkins || []).filter(c => c.data !== diaSelecionado);
            data.checkins.push({
                data: diaSelecionado,
                importou,
                ficou,
                nps,
                timestamp: new Date().toISOString()
            });

            saveData();
            atualizarMetricas();

            const btn = event.target;
            const original = btn.textContent;
            btn.textContent = '✅ Salvo!';
            btn.style.background = 'var(--success)';
            setTimeout(() => { btn.textContent = original;
                btn.style.background = ''; }, 1500);
        }

        // ========== PILLS & MÉTRICAS ==========
        function atualizarPills() {
            const { todos } = getBlocosDoDia();
            const pendentes = todos.filter(b => !b.done);
            document.getElementById('count-pessoal').textContent = pendentes.filter(b => b.pilar === 'pessoal').length;
            document.getElementById('count-familia').textContent = pendentes.filter(b => b.pilar === 'familia').length;
            document.getElementById('count-profissional').textContent = pendentes.filter(b => b.pilar === 'profissional')
                .length;
        }

        function atualizarMetricas() {
            const { todos } = getBlocosDoDia();
            const total = todos.length;
            const feitos = todos.filter(b => b.done).length;
            const pct = total > 0 ? Math.round((feitos / total) * 100) : 0;
            const pendentes = total - feitos;

            document.getElementById('metrica-blocks').textContent = pct + '%';
            document.getElementById('metrica-pendentes').textContent = pendentes;
            document.getElementById('metrica-total').textContent = total;

            // Cor da % baseada no valor
            const metricaPct = document.getElementById('metrica-blocks');
            metricaPct.className = 'metrica-valor';
            if (pct >= 80) metricaPct.classList.add('green');
            else if (pct >= 50) metricaPct.classList.add('gold');
            else metricaPct.classList.add('red');
        }

        // ========== VISÃO SEMANAL ==========
        function renderizarSemana() {
            const hoje = new Date();
            const inicioSemana = new Date(hoje);
            inicioSemana.setDate(hoje.getDate() - hoje.getDay()); // Domingo

            const fimSemana = new Date(inicioSemana);
            fimSemana.setDate(inicioSemana.getDate() + 6);

            document.getElementById('semanaRange').textContent =
                `${inicioSemana.getDate()}/${inicioSemana.getMonth()+1} — ${fimSemana.getDate()}/${fimSemana.getMonth()+1}`;

            const grid = document.getElementById('semanaGrid');
            let html = '';

            for (let i = 0; i < 7; i++) {
                const d = new Date(inicioSemana);
                d.setDate(inicioSemana.getDate() + i);
                const key = getDateKey(d);
                const ds = getDiaSemana(d);
                const isHoje = key === getDateKey(new Date());

                // Calcular stats do dia
                const rotina = data.rotina[ds] || [];
                const extras = data.extras[key] || [];
                const concluidos = data.concluidos[key] || {};
                const total = rotina.length + extras.length;
                let feitos = 0;
                rotina.forEach((_, i) => { if (concluidos[`fixo-${i}`]) feitos++; });
                extras.forEach((_, i) => { if (concluidos[`extra-${i}`]) feitos++; });
                const pct = total > 0 ? Math.round((feitos / total) * 100) : 0;

                let barClass = 'red';
                if (pct >= 80) barClass = 'green';
                else if (pct >= 50) barClass = 'yellow';

                html += `
                    <div class="semana-dia ${isHoje ? 'hoje' : ''}" onclick="switchView('diario'); selecionarDia('${key}','${ds}')">
                        <div class="semana-dia-header">
                            <span class="semana-dia-nome">${NOMES_DIAS_LONGO[ds]} ${isHoje ? '⭐' : ''}</span>
                            <span class="semana-dia-data">${d.getDate()}/${d.getMonth()+1}</span>
                        </div>
                        <div class="semana-dia-stats">
                            <span>✅ <span style="color:var(--success)">${feitos}</span>/${total}</span>
                            <span>📊 ${pct}%</span>
                        </div>
                        <div class="semana-barra">
                            <div class="semana-barra-fill ${barClass}" style="width:${pct}%"></div>
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ========== INICIAR ==========
        init();
        console.log('⚡ GCP v2 — Gestão por Ciclos de Prioridade');
        console.log('🧑 Pessoal | 👨‍👩‍👧‍👦 Família | 💼 Profissional');
        console.log('📅 Visão Diária + Semanal | 🔒 Rotina Fixa por dia');
        console.log('💾 Dados salvos em localStorage.');
    </script>
</body>
</html>
